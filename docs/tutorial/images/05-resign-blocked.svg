<svg xmlns="http://www.w3.org/2000/svg" width="749" height="203" viewBox="0 0 749 203">
<rect width="100%" height="100%" rx="10" fill="#1e1e2e"/>
<rect width="100%" height="30" rx="10" fill="#313244"/>
<rect y="20" width="100%" height="10" fill="#313244"/>
<circle cx="18" cy="15" r="6" fill="#f38ba8"/>
<circle cx="38" cy="15" r="6" fill="#f9e2af"/>
<circle cx="58" cy="15" r="6" fill="#a6e3a1"/>
<text x="375" y="20" fill="#bac2de" font-size="13" text-anchor="middle" font-family="PingFang SC, Helvetica, sans-serif">坑 4：重签名被 macOS「App 管理」拦截</text>
<text x="18" y="62" fill="#89dceb" font-size="13.5" font-family="Menlo, SF Mono, PingFang SC, monospace" xml:space="preserve">$ sudo xattr -cr /Applications/WeChat.app</text>
<text x="18" y="81" fill="#f38ba8" font-size="13.5" font-family="Menlo, SF Mono, PingFang SC, monospace" xml:space="preserve">xattr: [Errno 1] Operation not permitted: '/Applications/WeChat.app'</text>
<text x="18" y="100" fill="#89dceb" font-size="13.5" font-family="Menlo, SF Mono, PingFang SC, monospace" xml:space="preserve">$ sudo codesign --force --deep --sign - /Applications/WeChat.app</text>
<text x="18" y="119" fill="#cdd6f4" font-size="13.5" font-family="Menlo, SF Mono, PingFang SC, monospace" xml:space="preserve">/Applications/WeChat.app: replacing existing signature</text>
<rect x="12" y="123" width="725" height="19" rx="3" fill="#f9e2af" fill-opacity="0.14"/>
<text x="18" y="138" fill="#f38ba8" font-size="13.5" font-family="Menlo, SF Mono, PingFang SC, monospace" xml:space="preserve">/Applications/WeChat.app: Operation not permitted</text>
<text x="18" y="157" fill="#cdd6f4" font-size="13.5" font-family="Menlo, SF Mono, PingFang SC, monospace" xml:space="preserve">In subcomponent: /Applications/WeChat.app/Contents/MacOS/WeChatAppEx.app</text>
<text x="18" y="176" fill="#7f849c" font-size="13.5" font-family="Menlo, SF Mono, PingFang SC, monospace" xml:space="preserve"># 解决：给终端宿主（Cursor / Terminal）开「App 管理」+「完全磁盘访问」，⌘Q 重启后再执行</text>
</svg>