<svg xmlns="http://www.w3.org/2000/svg" width="659" height="222" viewBox="0 0 659 222">
<rect width="100%" height="100%" rx="10" fill="#1e1e2e"/>
<rect width="100%" height="30" rx="10" fill="#313244"/>
<rect y="20" width="100%" height="10" fill="#313244"/>
<circle cx="18" cy="15" r="6" fill="#f38ba8"/>
<circle cx="38" cy="15" r="6" fill="#f9e2af"/>
<circle cx="58" cy="15" r="6" fill="#a6e3a1"/>
<text x="330" y="20" fill="#bac2de" font-size="13" text-anchor="middle" font-family="PingFang SC, Helvetica, sans-serif">重签名成功</text>
<text x="18" y="62" fill="#89dceb" font-size="13.5" font-family="Menlo, SF Mono, PingFang SC, monospace" xml:space="preserve">$ pgrep -x WeChat &amp;&amp; echo "还在运行" || echo "已退出"</text>
<text x="18" y="81" fill="#cdd6f4" font-size="13.5" font-family="Menlo, SF Mono, PingFang SC, monospace" xml:space="preserve">已退出</text>
<text x="18" y="100" fill="#89dceb" font-size="13.5" font-family="Menlo, SF Mono, PingFang SC, monospace" xml:space="preserve">$ sudo xattr -cr /Applications/WeChat.app</text>
<text x="18" y="119" fill="#89dceb" font-size="13.5" font-family="Menlo, SF Mono, PingFang SC, monospace" xml:space="preserve">$ sudo codesign --force --deep --sign - /Applications/WeChat.app</text>
<text x="18" y="138" fill="#cdd6f4" font-size="13.5" font-family="Menlo, SF Mono, PingFang SC, monospace" xml:space="preserve">/Applications/WeChat.app: replacing existing signature</text>
<text x="18" y="157" fill="#89dceb" font-size="13.5" font-family="Menlo, SF Mono, PingFang SC, monospace" xml:space="preserve">$ codesign -dv /Applications/WeChat.app 2&gt;&amp;1 | grep -E "Signature|flags"</text>
<text x="18" y="176" fill="#cdd6f4" font-size="13.5" font-family="Menlo, SF Mono, PingFang SC, monospace" xml:space="preserve">CodeDirectory v=20400 size=366 flags=0x2(adhoc) hashes=5+3 location=embedded</text>
<rect x="12" y="180" width="635" height="19" rx="3" fill="#f9e2af" fill-opacity="0.14"/>
<text x="18" y="195" fill="#a6e3a1" font-size="13.5" font-family="Menlo, SF Mono, PingFang SC, monospace" xml:space="preserve">Signature=adhoc</text>
</svg>