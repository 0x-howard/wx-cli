<rect width="100%" height="100%" rx="10" fill="#1e1e2e"/>
<rect width="100%" height="30" rx="10" fill="#313244"/>
<rect y="20" width="100%" height="10" fill="#313244"/>
<circle cx="18" cy="15" r="6" fill="#f38ba8"/>
<circle cx="38" cy="15" r="6" fill="#f9e2af"/>
<circle cx="58" cy="15" r="6" fill="#a6e3a1"/>
<text x="457" y="20" fill="#bac2de" font-size="13" text-anchor="middle" font-family="PingFang SC, Helvetica, sans-serif">坑 3：官方签名微信，task_for_pid 被拒</text>
<text x="18" y="62" fill="#89dceb" font-size="13.5" font-family="Menlo, SF Mono, PingFang SC, monospace" xml:space="preserve">$ sudo ./wx init</text>
<text x="18" y="81" fill="#cdd6f4" font-size="13.5" font-family="Menlo, SF Mono, PingFang SC, monospace" xml:space="preserve">检测微信数据目录...</text>
<text x="18" y="100" fill="#cdd6f4" font-size="13.5" font-family="Menlo, SF Mono, PingFang SC, monospace" xml:space="preserve">数据目录: ~/Library/Containers/com.tencent.xinWeChat/.../xwechat_files/wxid_xxxx/db_storage</text>
<text x="18" y="119" fill="#cdd6f4" font-size="13.5" font-family="Menlo, SF Mono, PingFang SC, monospace" xml:space="preserve">扫描加密密钥…</text>
<text x="18" y="138" fill="#cdd6f4" font-size="13.5" font-family="Menlo, SF Mono, PingFang SC, monospace" xml:space="preserve">WeChat PID: 7845</text>
<rect x="12" y="142" width="889" height="19" rx="3" fill="#f9e2af" fill-opacity="0.14"/>
<text x="18" y="157" fill="#cdd6f4" font-size="13.5" font-family="Menlo, SF Mono, PingFang SC, monospace" xml:space="preserve">WeChat 签名: 官方 Hardened Runtime（内存扫描需要 sudo；hook 也建议 sudo）</text>
<text x="18" y="176" fill="#cdd6f4" font-size="13.5" font-family="Menlo, SF Mono, PingFang SC, monospace" xml:space="preserve">找到 26 个加密数据库</text>
<rect x="12" y="180" width="889" height="19" rx="3" fill="#f9e2af" fill-opacity="0.14"/>
<text x="18" y="195" fill="#f38ba8" font-size="13.5" font-family="Menlo, SF Mono, PingFang SC, monospace" xml:space="preserve">错误: task_for_pid 失败 (kr=5)。</text>
<text x="18" y="214" fill="#cdd6f4" font-size="13.5" font-family="Menlo, SF Mono, PingFang SC, monospace" xml:space="preserve">当前 WeChat 是官方 Hardened Runtime 签名。请从本机 GUI Terminal 重试，并在「开发者工具」中允许该 Terminal。</text>
<text x="18" y="233" fill="#7f849c" font-size="13.5" font-family="Menlo, SF Mono, PingFang SC, monospace" xml:space="preserve"># 给终端开了「开发者工具」权限后重试，结果完全一样</text>
